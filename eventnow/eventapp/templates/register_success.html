{% extends "base.html" %}
{% block title %}Registration Confirmed — EventNow{% endblock %}

{% block content %}
<style>
    body { background: #f8fafc; }
    .success-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
    }
    .success-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 48px 40px;
        width: 100%;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
</style>

<div class="success-wrapper">
    <div class="success-card">
        <div style="font-size:3rem; margin-bottom:16px;">🎉</div>
        <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:8px;">
            You're registered!
        </h1>
        <p style="color:#64748b; margin-bottom:8px;">
            You have successfully registered for
        </p>
        <p style="font-weight:700; font-size:1.1rem; color:#2563eb; margin-bottom:32px;">
            {{ event.title }}
        </p>
        <a href="{% url 'index' %}" class="btn-primary-custom"
           style="justify-content:center; width:100%; padding:12px;">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
