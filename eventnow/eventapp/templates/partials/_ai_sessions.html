<div id="ai-sessions-result">
{% if suggestions %}
<div style="margin-top:10px;">
    <div style="font-size:0.78rem; font-weight:600; color:#15803d; margin-bottom:8px;">
        ✨ Click a title to use it
    </div>
    {% for s in suggestions %}
    <div onclick="document.querySelector('input[name=session_title]').value = this.dataset.text"
        data-text="{{ s|escapejs }}"
        style="padding:10px 14px; border:1px solid #e2e8f0; border-radius:8px;
               margin-bottom:6px; cursor:pointer; font-size:0.85rem; background:white;
               transition:all 0.15s;"
        onmouseover="this.style.borderColor='#2563eb'; this.style.background='#eff6ff';"
        onmouseout="this.style.borderColor='#e2e8f0'; this.style.background='white';">
        {{ s }}
    </div>
    {% endfor %}
</div>
{% elif error %}
<div style="background:#fef2f2; border:1px solid #fecaca; border-radius:8px;
            padding:12px 16px; margin-top:10px; font-size:0.85rem; color:#dc2626;">
    Error: {{ error }}
</div>
{% endif %}
</div>
