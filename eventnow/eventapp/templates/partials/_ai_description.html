<div id="ai-description-result">
{% if description %}
<div style="background:#f0fdf4; border:1px solid #86efac; border-radius:8px;
            padding:14px 16px; margin-top:10px;">
    <div style="font-size:0.78rem; font-weight:600; color:#15803d; margin-bottom:8px;">
        ✨ AI Generated Description
    </div>
    <p style="font-size:0.88rem; color:#0f172a; margin:0 0 12px;">{{ description }}</p>
    <button type="button"
        onclick="document.querySelector('textarea[name=description]').value = this.dataset.text"
        data-text="{{ description|escapejs }}"
        style="background:#15803d; color:white; border:none; padding:6px 14px;
               border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer;">
        ✅ Use this description
    </button>
</div>
{% elif error %}
<div style="background:#fef2f2; border:1px solid #fecaca; border-radius:8px;
            padding:12px 16px; margin-top:10px; font-size:0.85rem; color:#dc2626;">
    Error: {{ error }}
</div>
{% endif %}
</div>
