{% extends "base.html" %}
{% block title %}Login — EventNow{% endblock %}

{% block content %}
<style>
    body { background: #f8fafc; }
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
    }
    .auth-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .auth-brand {
        font-family: 'DM Serif Display', serif;
        font-size: 1.6rem;
        text-align: center;
        margin-bottom: 8px;
        color: #0f172a;
    }
    .auth-brand span { color: #2563eb; }
    .auth-subtitle {
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 32px;
    }
    .error-msg {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.85rem;
        margin-bottom: 16px;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-brand">Event<span>Now</span></div>
        <div class="auth-subtitle">Sign in to manage your events</div>

        {% if form.errors %}
        <div class="error-msg">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom:16px;">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input"
                    placeholder="Enter your username" autofocus required>
            </div>

            <div style="margin-bottom:24px;">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary-custom"
                style="width:100%; justify-content:center; padding:12px;">
                Sign In →
            </button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:#64748b;">
            Don't have an account?
            <a href="{% url 'signup' %}" style="color:#2563eb; font-weight:600;">
                Sign up
            </a>
        </div>

    </div>
</div>
{% endblock %}
