<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventNow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --sidebar-width: 240px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--surface-2); color: var(--text-main); }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            z-index: 100;
        }
        .sidebar-brand {
            font-family: 'DM Serif Display', serif;
            font-size: 1.4rem;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin-bottom: 28px;
        }
        .sidebar-brand .dot { color: var(--primary); }
        .sidebar-section-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 0 12px;
            margin: 16px 0 8px;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            margin-bottom: 2px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .sidebar-link svg { flex-shrink: 0; opacity: 0.7; }
        .sidebar-link:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar-link:hover svg { opacity: 1; }
        .sidebar-link.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar-link.active svg { opacity: 1; }
        .sidebar-divider { border-top: 1px solid var(--border); margin: 16px 0; }
        .sidebar-bottom { margin-top: auto; }
        .main-content { margin-left: var(--sidebar-width); flex: 1; min-height: 100vh; }
        .page-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 24px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .page-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }
        .page-body { padding: 32px 36px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; transition: box-shadow 0.2s; }
        .stat-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
        .stat-card .label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--text-main); margin-top: 4px; line-height: 1; }
        .event-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; transition: all 0.2s ease; text-decoration: none; color: inherit; display: block; }
        .event-card:hover { box-shadow: 0 8px 24px rgba(37,99,235,0.1); border-color: #93c5fd; transform: translateY(-2px); color: inherit; }
        .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; margin-bottom: 24px; }
        .form-section h5 { font-weight: 600; font-size: 1rem; margin-bottom: 20px; color: var(--text-main); }
        .badge-live { background: #d1fae5; color: #065f46; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .badge-upcoming { background: #dbeafe; color: #1e40af; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .badge-draft { background: #f1f5f9; color: #64748b; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .btn-primary-custom { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
        .btn-primary-custom:hover { background: var(--primary-dark); color: white; }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 9px 18px; border-radius: 8px; font-weight: 500; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .btn-ghost:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); text-align: left; }
        .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: var(--surface-2); }
        .session-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 16px; }
        .session-time { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; min-width: 90px; padding-top: 2px; }
        .track-pill { font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
        .register-session { border: 2px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; display: flex; align-items: flex-start; gap: 14px; }
        .register-session:hover { border-color: #93c5fd; background: var(--primary-light); }
        .register-session.selected { border-color: var(--primary); background: var(--primary-light); }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--text-main); background: var(--surface); transition: border-color 0.15s; outline: none; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; display: block; }

        /* ── LOGOUT BUTTON STYLE ── */
        .sidebar-logout {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            margin-bottom: 2px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .sidebar-logout:hover { background: #fef2f2; color: #dc2626; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 12px 16px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
                overflow-x: auto;
            }

            .sidebar-brand {
                margin-bottom: 0;
                margin-right: 12px;
                font-size: 1.1rem;
            }

            .sidebar-section-label {
                display: none;
            }

            .sidebar-link {
                padding: 6px 10px;
                font-size: 0.78rem;
                margin-bottom: 0;
                white-space: nowrap;
            }

            .sidebar-divider {
                display: none;
            }

            .sidebar-bottom {
                margin-top: 0;
                display: flex;
                gap: 4px;
                flex-wrap: nowrap;
            }

            .sidebar-logout {
                padding: 6px 10px;
                font-size: 0.78rem;
                white-space: nowrap;
            }

            .main-content {
                margin-left: 0;
            }

            .page-header {
                padding: 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .page-body {
                padding: 16px;
            }

            .stat-card .value {
                font-size: 1.5rem;
            }

            /* 讓 grid 在手機上變單列 */
            .row {
                --bs-gutter-x: 0.75rem;
            }

            /* Event cards 按鈕換行 */
            .event-card > div {
                flex-direction: column;
                align-items: flex-start !important;
            }

            /* Form grid 在手機變單列 */
            div[style*="grid-template-columns:1fr 1fr"] {
                grid-template-columns: 1fr !important;
            }

            div[style*="grid-template-columns: 1fr 1fr"] {
                grid-template-columns: 1fr !important;
            }
        }

        /* Landing page responsive */
        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr !important;
                padding: 40px 24px !important;
                gap: 32px !important;
            }

            .hero h1 {
                font-size: 2rem !important;
            }

            .feature-grid {
                grid-template-columns: 1fr !important;
            }

            .steps {
                grid-template-columns: 1fr !important;
                gap: 24px !important;
            }

            .landing-nav {
                padding: 0 16px !important;
            }

            .how-section {
                padding: 40px 24px !important;
            }

            .features-section {
                padding: 40px 24px !important;
            }

            .cta-section {
                padding: 40px 24px !important;
            }
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.8"></script>
</body>
</html>
